function carry(p,priceOverride){
  var P=priceOverride||p.priceFrom; if(!P)return null;
  var r=Math.pow(1+FIN.rate/100/2,1/6)-1, n=FIN.amort*12, /* Canadian fixed: compounded semi-annually */ loan=P*(1-FIN.down/100);

  var tr=TAXR[p.city]||{r:1.45,ok:0};
  var taxYr=p.taxYr||Math.round(P*tr.r/100);
  var fee=p.fee||0, ins=FIN.ins;
  var total=mort+taxYr/12+fee+ins;
  var net=p.rent?p.rent-total:null;
  return {P:P,loan:loan,mort:mort,taxYr:taxYr,taxMo:taxYr/12,taxOk:!!p.taxYr||tr.ok,taxRate:tr.r,fee:fee,ins:ins,total:total,net:net,verdict:net==null?null:net>=50?'pos':net<=-50?'neg':'neu'}}
